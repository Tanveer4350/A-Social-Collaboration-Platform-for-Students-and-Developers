server.port=8080
server.servlet.context-path=/

# App Info
spring.application.name=ProjectConnect Server

# Database Configuration (Default: Embedded H2 Database with persistence in file for easy inspection)
spring.datasource.url=jdbc:h2:mem:projectconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
projectconnect.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
projectconnect.jwt.expiration-ms=86400000

# CORS Allowed Origins
projectconnect.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

